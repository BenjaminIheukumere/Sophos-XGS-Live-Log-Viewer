name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Test
        run: dotnet test SophosXgsLiveLogViewer.slnx --configuration Release

      - name: Publish win-x64
        run: >
          dotnet publish SophosXgsLiveLogViewer.App/SophosXgsLiveLogViewer.App.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=false
          -p:DebugType=none
          -p:DebugSymbols=false
          --output artifacts/win-x64

      - name: Prepare release asset
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          Copy-Item `
            -LiteralPath "artifacts/win-x64/Sophos XGS Live Log Viewer.exe" `
            -Destination "dist/Sophos-XGS-Live-Log-Viewer-${{ github.ref_name }}-win-x64.exe" `
            -Force

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Sophos-XGS-Live-Log-Viewer-${{ github.ref_name }}-win-x64.exe
